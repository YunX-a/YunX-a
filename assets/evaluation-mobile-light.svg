<svg xmlns="http://www.w3.org/2000/svg" width="200" height="202" viewBox="0 0 200 202" role="img" aria-labelledby="title desc"><title id="title">模型评测</title><desc id="desc">模型评测：性能与精度测试。服务化压测 / 公开基准评测 / Trace 分析与结果汇总。配图为公开接口示例，不含内部实现或运行数据。</desc><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a371f7"/><stop offset="1" stop-color="#58a6ff"/></linearGradient><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f8fa"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs><defs>
